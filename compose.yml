services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: itajuba
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: itajuba_news
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itajuba -d itajuba_news"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
